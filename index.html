  <!-- ❤️ Floating Cursor: heart + emoji1 + emoji2 -->
  <script type="text/javascript">
  var colours = ['#5ba8e8', '#7eb8e8', '#3d8fd4', '#b8d4ee', '#4db8ff', '#9ec4e8'];
  var EMOJI = ['./images/emoji1.png', './images/emoji2.png'];
  var minisize = 16;
  var maxisize = 28;
  var hearts = 66;
  var over_or_under = "over";

  var x = ox = 400;
  var y = oy = 300;
  var swide = 800;
  var shigh = 600;
  var sleft = sdown = 0;
  var herz = [];
  var herzx = [];
  var herzy = [];
  var herzs = [];
  var herzImg = [];
  var kiss = false;

  if (typeof('addRVLoadEvent') != 'function') function addRVLoadEvent(funky) {
    var oldonload = window.onload;
    if (typeof(oldonload) != 'function') window.onload = funky;
    else window.onload = function() {
      if (oldonload) oldonload();
      funky();
    }
  }

  addRVLoadEvent(mwah);

  function mwah() { if (document.getElementById) {
    var i;
    for (i = 0; i < hearts; i++) {
      var heart = createDiv("auto", "auto");
      heart.style.visibility = "hidden";
      heart.style.zIndex = (over_or_under == "over") ? "1001" : "0";
      heart.style.pointerEvents = "none";
      heart.style.opacity = 0.75;

      var kind = i % 3; /* 0 = heart, 1 = emoji1, 2 = emoji2 */
      if (kind === 0) {
        var span = document.createElement("span");
        span.style.color = colours[i % colours.length];
        span.textContent = String.fromCharCode(9829);
        heart.appendChild(span);
        herzImg[i] = null;
      } else {
        var img = document.createElement("img");
        img.src = EMOJI[kind - 1];
        img.alt = "";
        img.style.width = minisize + "px";
        img.style.height = "auto";
        img.style.pointerEvents = "none";
        (function (idx, image, parent) {
          image.onerror = function () {
            var t = document.createElement("span");
            t.style.color = colours[idx % colours.length];
            t.textContent = String.fromCharCode(9829);
            t.style.fontSize = minisize + "px";
            parent.innerHTML = "";
            parent.appendChild(t);
            herzImg[idx] = null;
          };
        })(i, img, heart);
        heart.appendChild(img);
        herzImg[i] = img;
      }

      document.body.appendChild(heart);
      herz[i] = heart;
      herzy[i] = false;
    }
    set_scroll();
    set_width();
    herzle();
  }}

  function herzle() {
    var c;
    if (Math.abs(x - ox) > 1 || Math.abs(y - oy) > 1) {
      ox = x;
      oy = y;
      for (c = 0; c < hearts; c++) if (herzy[c] === false) {
        if (herzImg[c]) { herzImg[c].style.width = minisize + "px"; }
        else { herz[c].firstChild.style.fontSize = minisize + "px"; }
        herz[c].style.left = (herzx[c] = x - minisize / 2) + "px";
        herz[c].style.top = (herzy[c] = y - minisize) + "px";
        herz[c].style.visibility = 'visible';
        herzs[c] = minisize;
        break;
      }
    }
    for (c = 0; c < hearts; c++) if (herzy[c] !== false) blow_me_a_kiss(c);
    setTimeout(herzle, 40);
  }

  document.onmousedown = pucker;
  document.onmouseup = function() { clearTimeout(kiss); };

  function pucker() {
    ox = -1;
    oy = -1;
    kiss = setTimeout(pucker, 100);
  }

  function blow_me_a_kiss(i) {
    herzy[i] -= herzs[i] / minisize + i % 2;
    herzx[i] += (i % 5 - 2) / 5;
    if (herzy[i] < sdown - herzs[i] || herzx[i] < sleft - herzs[i] || herzx[i] > sleft + swide - herzs[i]) {
      herz[i].style.visibility = "hidden";
      herzy[i] = false;
    }
    else if (herzs[i] > minisize + 2 && Math.random() < .5 / hearts) break_my_heart(i);
    else {
      if (Math.random() < maxisize / herzy[i] && herzs[i] < maxisize) {
        herzs[i]++;
        if (herzImg[i]) { herzImg[i].style.width = herzs[i] + "px"; }
        else { herz[i].firstChild.style.fontSize = herzs[i] + "px"; }
      }
      herz[i].style.top = herzy[i] + "px";
      herz[i].style.left = herzx[i] + "px";
    }
  }

  function break_my_heart(i) {
    herz[i].style.opacity = 0;
    herz[i].style.transition = "opacity .4s ease";
    herzy[i] = false;
    setTimeout(function () {
      herz[i].style.visibility = "hidden";
      herz[i].style.opacity = 0.75;
      herz[i].style.transition = "none";
    }, 400);
  }

  document.onmousemove = mouse;
  function mouse(e) {
    if (e) { y = e.pageY; x = e.pageX; }
    else { set_scroll(); y = event.y + sdown; x = event.x + sleft; }
  }

  window.onresize = set_width;
  function set_width() {
    var sw_min = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
    var sh_min = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;
    swide = sw_min;
    shigh = sh_min;
  }

  window.onscroll = set_scroll;
  function set_scroll() {
    sdown = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
    sleft = window.pageXOffset || document.documentElement.scrollLeft || document.body.scrollLeft || 0;
  }

  function createDiv(height, width) {
    var div = document.createElement("div");
    div.style.position = "absolute";
    div.style.height = height;
    div.style.width = width;
    div.style.overflow = "hidden";
    div.style.backgroundColor = "transparent";
    return div;
  }
  </script>

  <script>
    let datetxt = "28 may 2011";
    let datatxtletter = "Sorry for the late birthday wish! You are a very special girl. Today, we wish you all the best, lots of health, and lots of joy. We hope we get to celebrate many more birthdays like this together. Happy birthday to you! 🐢🤍";
    let titleLetter = "To you";
    let charArrDate = datetxt.split('');
    let charArrDateLetter = datatxtletter.split('');
    let charArrTitle = titleLetter.split('');
    let currentIndex = 0;
    let currentIndexLetter = 0;
    let currentIndexTitle = 0;
    let date__of__birth = document.querySelector(".date__of__birth span");
    let text__letter = document.querySelector(".text__letter p");

    setTimeout(function(){
      timeDatetxt = setInterval(function(){
        if(currentIndex < charArrDate.length){
          date__of__birth.textContent += charArrDate[currentIndex];
          currentIndex++;
        } else {
          let i = document.createElement("i");
          i.className = "fa-solid fa-star";
          document.querySelector(".date__of__birth").prepend(i);
          document.querySelector(".date__of__birth").appendChild(i.cloneNode(true));
          clearInterval(timeDatetxt);
        }
      },100)
    },12000);

    var intervalContent;
    var intervalTitle;
    $("#btn__letter").on("click", function(){
      $(".box__letter").slideDown();
      setTimeout(function(){
        $(".letter__border").slideDown();
      },1000);
      setTimeout(function(){
        intervalTitle = setInterval(function(){
          if(currentIndexTitle < charArrTitle.length){
            document.querySelector(".title__letter").textContent += charArrTitle[currentIndexTitle];
            let i = document.createElement("i");
            i.className = "fa-solid fa-heart";
            document.querySelector(".title__letter").appendChild(i);
            currentIndexTitle++;
          } else {
            clearInterval(intervalTitle);
          }
        },100);
      },2000);
      setTimeout(function(){
        document.querySelector("#heart__letter").classList.add("animationOp");
        document.querySelector(".love__img").classList.add("animationOp");
        document.querySelector("#mewmew").classList.add("animationOp");
      },2800);
      setTimeout(function(){
        document.querySelectorAll(".heart").forEach((item)=>{
          item.classList.add("animation");
        })
      },3500);
      setTimeout(function(){
        intervalContent = setInterval(function(){
          if(currentIndexLetter < charArrDateLetter.length){
            text__letter.textContent += charArrDateLetter[currentIndexLetter];
            currentIndexLetter++;
          } else {
            clearInterval(intervalContent);
          }
        },50);
      },6000);
    });

    $(".close").on("click", function(){
      clearInterval(intervalContent);
      document.querySelector(".title__letter").textContent = "";
      text__letter.textContent = "";
      currentIndexLetter = 0;
      currentIndexTitle = 0;
      document.querySelector("#heart__letter").classList.remove("animationOp");
      document.querySelector(".love__img").classList.remove("animationOp");
      document.querySelector("#mewmew").classList.remove("animationOp");
      document.querySelectorAll(".heart").forEach((item)=>{
        item.classList.remove("animation");
      });
      $(".box__letter").slideUp();
      $(".letter__border").slideUp();
    });
  </script>

    },
    {
      name: "Sensei Kinda",
      teacher: true,
      tag: "ام السلاحف",
      thumb: "Turtles/turtle2.png",
      media: ["Turtles/turtle2.png"],
      msg: "Happy birthday shizu san :3\n\nمش عارفة ابدأ معايدتي😭، عايزة اقلك انك حد قريب لي مع اني مش بظهر هاد الشي بس حتبقي زي اختي الصغيرة بالنسبة لي\n\nبتمنى لك كل الخير والتوفيق والبركة في عمرك ( :\n\nبما انك لسا ببداية شبابك وعمرك فاسمحي لنفسك تجربي حاجات جديدة حتى لو أخطأت او فشلتي مش نهاية العالم و لسا قدامك فرص كثير، والتواضع جميل اه بس مش على حساب موهبتك الفعلية خليكي مؤمنة بكلشي قادرة تعمليه وتمسكي فيه وطوريه عشان تبقي نسخة احسن من نفسك ولا تكوني قاسية مع ذاتك مهما حصل عشان انت اهم من اي حد لك، برضو اه ممكن تكون الحياة تعيسة او مؤلمة مرات وصعبة علينا بس هذي هي الحياة ولو كانت حياتنا كلها جميلة ما كنا حنقدر نعمة المواقف والذكريات الحلوة فعشان هيك وجود المواقف الصعبة بحياتنا ممكن تكون حاجة ايجابية ولو ما كانت بالطريقة الي معتقدين فيها ايش هي الاشياء الايجابية فعلا (معلش عالنكد)\n\nممكن كلامي عامي مدري بس وقت كنت في عمرك كنت لسا بكوّن نظرتي للحياة بحط قراراتي واهدافي بثبت مبادئي وافكاري فعشان كدة قلت لك دي النصيحة الفلاحة😭 بس بجد بجد حتى ببساطتها وعموميتها ضلك ذكري نفسك عشان متتعبيش بعدين ( :\n\nحاسة اني عجزت ونكدت بما فيه الكفاية 😭💔 المهم الحياة حلوة، صعبة، في ناس زفت وفي ناس كويسة حتمر عليكي كثير ف take it easy وما تضغطي على نفسك في المواقف الي حتمري فيها وتعلمي من كل موقف وحسني من نفسك فيه ( :\n\nاتمنى انك تحققي طموحك وترضي عن نفسك وتكوني في المكان الي تحبيه شيزو سان\n\nومعلش انها قلبت نصيحة بدل معايدة 🥀\n\nوأهم حاجة ووييييييييييييييي✨ ✨"
    },
    {
      name: "𝐄𝐯𝐢𝐥 𝐭𝐮𝐫𝐭𝐥𝐞 𝐧𝐨.𝟑",
      tag: "طرزان - كويت الشيخ",
      thumb: "Turtles/turtle3.png",
      media: ["Turtles/turtle3.png", "Turtles/turtle3-drawing.jpg"],
      msg: "Hai hai عيد ميلاد سعيد ياشيزو (مفروض اقولها قبل اشهر) بس طبعا بفضلي عيد ميلادك صار اليوم   كنا مشغولين كل يوم بنجهز لعيد ميلادك وانا الي كنت مسؤول على سلاحف اكثرهم اشتغال  لدرجه عيروسه تأثر بجهودي مهم عيد ميلاد سعيد ×٢ وكل عام وانتي بخير واتمنى ان رجولك تزيد طولا"
    },
    {
      name: "𝐄𝐯𝐢𝐥 𝐭𝐮𝐫𝐭𝐥𝐞 𝐧𝐨.𝟔",
      tag: "مونيكا لحست دماغه",
      thumb: "Turtles/turtle6.png",
      media: ["Turtles/turtle6.png", "Turtles/turtle6-drawing.png", "Turtles/turtle6-drawing2.png.png"],
      msg: "كل عام و انت بخير شي-تشان\n\nكل يوم يمر في حياة الإنسان يقترب خطوة من تحقيق حلمه\n\nانت اليوم اقتربتي سنة من الموت\n\nأتمنى لك تحققي أحلامك المتبقية في الاجل القريب\n\nإن كانت من تطور، زيادة في الطول، نجاح، موت. أتمنى لك سنة سعيدة"
    },
    {
      name: "𝐄𝐯𝐢𝐥 𝐭𝐮𝐫𝐭𝐥𝐞 𝐧𝐨.𝟒",
      tag: "مديرة الحفاظ على البيئة",
      thumb: "Turtles/turtle4.png",
      media: ["Turtles/turtle4.png", "Turtles/turtle4-drawing.png"],
      msg: "احم احممم\n\n# كل سنة وانتي طيبة يا شيزوكاااااا🎉 (◍•ᴗ•◍)\n\nكل سنة واصغر عضوة في السلاحف طيبة، كل سنة والفنانة العظيمة ملهلبة، كل سنة والكاتبة الرائعة طيبة يارب 💙🎉\n\nمش احسن وحدة انا الصراحه في التعبير عن شعورها في الكتابة بس هحاول XD (• ▽ •;)\n\nعقبال ال100 سنة يارب بصحة وسلامة وفرحة وسعادة دائمة ^^ والسنة دي تكون احلى من الي فاتت حتى وتحققي احلامك فيها وتعملي انجازات مبهرة زي دايماً🌱✨\n\nوافتكري اوعي عمرك تقللي من مهاراتك أو تقولي كتابتك وحشة أو هطعنك!! انتي موهوبة يا شيزو وبالنسبالي مستواكي حاجة انا بهدف اوصلها (: 💙\n\nربنا يخليكي يا احسن الناس الي عرفتهم، بحب لما اتكلم معاكي بجد 🙂 بحبك انتي وشيزو الاوسي وكلكو كدا 3:\n\nومش هنسى لما كنت تساعديني حتى لما تكون نفسيتي سيئة وتنصحيني بشكرك بجد على كل مرة ساعدتني فيها TT\n\nخلصت قدراتي التعبيرية فمش عارفة اقول ايه زيادة..\n\nاه صحيح!!\n\nاحم احممم\n\nنعتذر عشرليون مرة على التأخير غير الطبيعي دا بجد، اسفين اويييي TT\n\nواسفه لو كانت هديتي بسيطة انتي تستاهلي حاجة افخم بكل الي بتقدميهولنا يا شيزو😭 حتى في العموم اسفه لو كنت مقصرة معاكي في حاجة أو مش بهلبك زي ما بتلهلبيني ):\n\nوأخيراً، عيد ميلادٍ سعيد شيزوكا تشان💙 (حتى لو عدى(• ▽ •;)) ربنا يخليكي للسلاحف دايماً يارب وتكوني دايماً فرحانة :>"
    },
    {
      name: "𝐄𝐯𝐢𝐥 𝐭𝐮𝐫𝐭𝐥𝐞 𝐧𝐨.𝟓",
      nudge: true,
      thumb: "Turtles/turtle5.png",
      media: ["Turtles/turtle5.png"],
      msg: "هاي، أنا هي أنتِ... بس من الماضي. حضرت كل ده، فعلى الأغلب أنتِ متفاجئة... لكن أنا لا (:\n\nكنت أعرف إن اليوم ده هييجي، بس ما كنت أعرف إنكِ هتكوني بهذا الشكل."
    }
  ];

  var BEAR = {
    name: "IceBear",
    media: ["Turtles/IceBear.gif"],
    msg: "كل عام وانتي بخير 🪷\n\nشي سان، أتمنى إنك استمتعتي مع السلاحف ودخلتي الآن على مرحلة جديدة في حياتك. هل راح نشوفك مرة ثانية أو لا؟ الله أعلم، لكن أدعو الله إنك تكونين سعيدة وهنيئة في مرحلتك الجديدة، ويكتب لك فيها كل الخير والتوفيق.\n\nإنتِ بسم الله ما شاء الله تلميذة ذكية وواعية، وما زلتي تتعلمين وتكبرين، وإن شاء الله تستمرين على هذا الطريق وتتعلمين من كل شيء يمر عليك، سواء كان شيء جميل أو حتى شيء صعب.\n\nوأعرف إن هذي مباركة متأخرة بعيد ميلادك، لكن كل عام وانتي بخير مرة ثانية 🎂🪷\n\nوإن شاء الله مهما أخذتك الأيام ومهما تغيرت المراحل، تفتكرين أيام السلاحف بابتسامة، وتفتكرين إن كان لكِ مكان هنا في يوم من الأيام 🐢😈\n\nالله يوفقك ويحفظك، ويكتب لك الخير في كل خطوة جاية، ويجعل مرحلتك الجديدة أجمل مما تتوقعين. وبالتوفيق في كل شيء جاي لكِ، وإن شاء الله تكون بداية جميلة لشيء أجمل. 💫"
  };

  var grid = document.getElementById("turtles-grid");
  var modal = document.getElementById("turtle-modal");
  var mName = document.getElementById("turtle-modal-name");
  var mMedia = document.getElementById("turtle-modal-media");
  var mMsg = document.getElementById("turtle-modal-msg");

  function buildCard(item) {
    var btn = document.createElement("button");
    btn.type = "button";

    if (item.teacher) {
      btn.className = "teacher-card";
      var timg = document.createElement("img");
      timg.className = "teacher-img";
      timg.src = CDN + item.thumb;
      timg.alt = item.name;
      timg.loading = "lazy";
      var tname = document.createElement("span");
      tname.className = "bear-name";
      tname.textContent = item.name;
      var thint = document.createElement("span");
      thint.className = "bear-hint";
      thint.textContent = (item.tag ? item.tag + " · " : "") + "اضغطي عليّ 🐢";
      btn.appendChild(timg);
      btn.appendChild(tname);
      btn.appendChild(thint);
      btn.addEventListener("click", function () { openModal(item); });
      return btn;
    }

    btn.className = "turtle-card";

    var thumb = document.createElement("span");
    thumb.className = "turtle-thumb" + (item.nudge ? " nudge-right" : "");
    var img = document.createElement("img");
    img.src = CDN + item.thumb;
    img.alt = item.name;
    img.loading = "lazy";
    thumb.appendChild(img);

    var name = document.createElement("span");
    name.className = "turtle-name";
    name.textContent = item.name;

    btn.appendChild(thumb);
    btn.appendChild(name);
    if (item.tag) {
      var tag = document.createElement("span");
      tag.className = "turtle-tag";
      tag.textContent = item.tag;
      btn.appendChild(tag);
    }
    btn.addEventListener("click", function () { openModal(item); });
    return btn;
  }

  var teachersRow = document.getElementById("teachers-row");
  TURTLES.forEach(function (t) {
    var card = buildCard(t);
    if (t.teacher) { teachersRow.appendChild(card); }
    else { grid.appendChild(card); }
  });

  var bearCard = document.getElementById("bear-card");
  bearCard.addEventListener("click", function () { openModal(BEAR); });
  bearCard.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { openModal(BEAR); }
  });

  function openModal(item) {
    mName.textContent = item.name;
    mMedia.innerHTML = "";
    item.media.forEach(function (src) {
      var img = document.createElement("img");
      img.src = CDN + src;
      img.alt = item.name;
      mMedia.appendChild(img);
    });
    if (item.msg) {
      mMsg.textContent = item.msg;
      mMsg.style.display = "";
    } else {
      mMsg.textContent = "";
      mMsg.style.display = "none";
    }
    modal.classList.add("open");
    document.body.style.overflow = "hidden";
  }

  function closeModal() {
    modal.classList.remove("open");
    document.body.style.overflow = "";
  }

  document.getElementById("turtle-modal-close").addEventListener("click", closeModal);
  modal.addEventListener("click", function (e) {
    if (e.target === modal) { closeModal(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { closeModal(); }
  });
})();
</script>
